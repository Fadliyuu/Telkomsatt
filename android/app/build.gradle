plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

def webUrl = providers.gradleProperty('TELKOMSAT_WEB_URL').getOrElse('').trim()
if (webUrl) {
    try {
        def uri = new URI(webUrl)
        if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment
                || !(uri.path in ['', '/'])) throw new IllegalArgumentException()
    } catch (Exception ignored) {
        throw new GradleException('TELKOMSAT_WEB_URL harus berupa alamat utama HTTPS, tanpa path, query, atau akun.')
    }
}

android {
    namespace 'id.co.telkomsat.inventory'
    compileSdk 35
    defaultConfig {
        applicationId 'id.co.telkomsat.inventory'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'WEB_URL', '"' + webUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
